# Checks the front end on every push and pull request: lint, unit tests
# (with the API contract check), the build, and the end-to-end journeys.
name: Front end

on:
  push:
    paths: ['frontend/**', 'api/**', '.github/workflows/frontend.yml']
  pull_request:
    paths: ['frontend/**', 'api/**', '.github/workflows/frontend.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
